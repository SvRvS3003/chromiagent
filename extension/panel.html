<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chromiagent</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="sparkle"></div>
    <select id="agent" title="Agent CLI"><option value="claude">Claude Code</option></select>
    <span class="spacer"></span>
    <button id="grab" class="icon" title="Select an element and send feedback to the agent">
      <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3zm12 0h6v6h-2V5h-4zM3 15h2v4h4v2H3zm9-5 9 3.5-3.9 1.6 3.4 3.4-1.4 1.4-3.4-3.4L14.1 21z"/></svg>
    </button>
    <button id="restart" class="icon" title="New session">
      <svg viewBox="0 0 24 24"><path d="M11 5v6H5v2h6v6h2v-6h6v-2h-6V5z"/></svg>
    </button>
    <button id="close" class="icon" title="Close">
      <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
  </header>
  <main id="termview"><div id="term"></div></main>
  <div id="notice" hidden>
    <div class="ask-head"><div class="sparkle"></div><b>Chromiagent</b> needs you</div>
    <p id="notice-q"></p>
    <button type="button" id="notice-go" class="ask-send">Go to the tab</button>
  </div>
  <form id="ask" hidden>
    <div class="ask-head"><div class="sparkle"></div><b>Chromiagent</b> asks
      <button type="button" id="ask-x" class="icon small" title="Cancel (Esc)" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button></div>
    <p id="ask-q"></p>
    <div id="ask-opts"></div>
    <div class="ask-row"><textarea id="ask-in" rows="1"></textarea><button type="submit" class="ask-send" aria-label="Send">↵</button></div>
  </form>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="vendor/addon-unicode11.js"></script>
  <script src="glow.js"></script>
  <script src="cdp.js"></script>
  <script src="bridge.js"></script>
  <script src="panel.js"></script>
</body>
</html>
